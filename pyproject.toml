[project]
name = "dpdem"
version = "0.1.0"
description = "Dilated-Polyhedron-based Discrete Element Method for ice-structure interaction simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "jax-md>=0.2.8",
    "jaxlie>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "imageio-ffmpeg>=0.5.0",
    "imageio>=2.31.0",
    "opencv-python>=4.5.0",
    "shapely>=2.0.0",
    "scikit-image>=0.21.0",
    "gdown>=5.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ipython>=8.0.0",
]
